# In a checkout of this branch (with the vendor/archipelago submodule): copy
# this to docker-compose.yml, copy .env.example to .env and fill it in, put the
# generated seed .zip in ./data/seed/, then: docker compose up -d --build
#
# The container speaks plain HTTP on 8080; put it behind something that
# terminates TLS, like the Caddy service below. PopTracker and the browser
# both reach Archipelago through the same host and port as the site.

services:
  yogos:
    build: .
    image: you-only-get-one-slot
    restart: unless-stopped
    volumes:
      - ./data:/data
    # Settings and secrets: copy .env.example to .env and fill it in.
    env_file: .env

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # YOGOS_HOST comes from .env: the host part of PUBLIC_URL.
    command: caddy reverse-proxy --from ${YOGOS_HOST:?set YOGOS_HOST in .env} --to yogos:8080
    volumes:
      - caddy-data:/data

volumes:
  caddy-data:
